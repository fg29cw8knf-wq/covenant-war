# Builds the Mac app (tools/build_mac.sh) whenever main changes, and puts it on
# the "mac" release, always at the same address:
#   https://github.com/fg29cw8knf-wq/covenant-war/releases/download/mac/CovenantWar-Mac.zip
# Run it by hand from the Actions tab (Mac app > Run workflow) for a fresh one.
# How to open it the first time: docs/mac.md.
name: Mac app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mac-app
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Godot and its macOS export template (cached)
        id: godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-macos

      - name: Download Godot
        if: steps.godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot/templates
          cd ~/godot
          base=https://github.com/godotengine/godot/releases/download/$GODOT_VERSION-stable
          curl -sSLo godot.zip $base/Godot_v$GODOT_VERSION-stable_linux.x86_64.zip
          unzip -q godot.zip && rm godot.zip
          curl -sSLo templates.tpz $base/Godot_v$GODOT_VERSION-stable_export_templates.tpz
          unzip -q -j templates.tpz templates/macos.zip templates/version.txt -d templates && rm templates.tpz

      - name: Install Godot
        run: |
          dir=~/.local/share/godot/export_templates/$GODOT_VERSION.stable
          mkdir -p "$dir" && cp ~/godot/templates/* "$dir"/
          sudo ln -sf ~/godot/Godot_v$GODOT_VERSION-stable_linux.x86_64 /usr/local/bin/godot

      # the native video player's libraries and Gary's 4K films, from their
      # releases (native-video, films), so the app plays the films at full size;
      # without them it plays the Theora copies (tools/fetch_native.sh)
      - name: Native video player and the 4K films
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/fetch_native.sh

      - name: Import the project
        run: godot --headless --import

      - name: Build the Mac app
        run: tools/build_mac.sh

      - name: Publish to the mac release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          built=$(cat build/CovenantWar-Mac.txt)
          gh release delete mac --yes --cleanup-tag || true
          gh release create mac build/CovenantWar-Mac.zip --target "$GITHUB_SHA" --latest=false \
            --title "Mac app (built $built)" \
            --notes "The game for Mac (Apple silicon and Intel), built $built from ${GITHUB_SHA::7}. Download CovenantWar-Mac.zip, unzip it and open The Covenant War. The first time: System Settings > Privacy & Security > Open Anyway. Step by step: https://github.com/${{ github.repository }}/blob/main/docs/mac.md"
