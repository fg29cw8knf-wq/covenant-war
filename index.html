// The web build's music player (window.CWMusic), driven by scripts/ui/music.gd.
//
// Godot's web audio loops a track by waiting for it to end and starting it
// again from the top, with a gap, and it can't loop back to LOOP_START. So on
// the web the music plays through the page's own Web Audio player instead,
// using the browser's sample-accurate looping: each track plays its intro once
// and then loops [loop start, real end) seamlessly, exactly like on desktop.
//
// tools/web_music.py puts this script in index.html, after window.CW_MUSIC:
//   {base: "music/", tracks: {name: {file, length, onset}}}
// file   - the MP3 next to index.html (with a ?v= of its contents, so a re-cut
//          track is never served stale from a cache)
// length - the real length of the music in seconds, from the source .ogg: the
//          loop's end. Never buffer.duration, which an MP3 decoder may pad.
// onset  - when the music first gets louder than ONSET_LEVEL (seconds, or null),
//          to find any padding a decoder leaves at the start (see trim).
//
// Music.gd talks to it in "slots" (0 and 1), like its two AudioStreamPlayers.
(function () {
	'use strict';
	const CFG = window.CW_MUSIC || { base: 'music/', tracks: {} };
	const TRACKS = CFG.tracks || {};
	const ONSET_LEVEL = 0.05; // the same as tools/web_music.py
	const CACHE = 'covenant-war-music';
	const AC = window.AudioContext || window.webkitAudioContext;
	let ctx = null;
	let out = null;
	try {
		ctx = new AC();
		out = ctx.createGain();
		out.connect(ctx.destination);
	} catch (e) {
		console.warn('Music: no Web Audio here, so no music.', e);
		return; // no window.CWMusic: music.gd falls back to Godot's own players
	}

	const lin = (db) => Math.pow(10, db / 20);

	// ------------------------------------------------------------ waking up ---
	// Browsers (iOS above all) start audio suspended until the player touches
	// the page, and iOS suspends it again after a call or a trip to the home
	// screen. Every touch, click or key wakes it while it's asleep.
	const GESTURES = ['touchstart', 'touchend', 'pointerdown', 'pointerup', 'mousedown', 'keydown', 'click'];
	let listening = false;
	function wake() {
		if (ctx.state === 'running') {
			listen(false);
			return;
		}
		ctx.resume().catch(() => {});
		try { // iOS: a silent sound started inside the touch is what really unlocks it
			const s = ctx.createBufferSource();
			s.buffer = ctx.createBuffer(1, 1, ctx.sampleRate);
			s.connect(out);
			s.start(0);
		} catch (e) { /* not needed elsewhere */ }
	}
	function listen(on) {
		if (on === listening) {
			return;
		}
		listening = on;
		GESTURES.forEach((g) => {
			if (on) {
				window.addEventListener(g, wake, { capture: true, passive: true });
			} else {
				window.removeEventListener(g, wake, { capture: true });
			}
		});
	}
	ctx.addEventListener('statechange', () => listen(ctx.state !== 'running'));
	document.addEventListener('visibilitychange', () => {
		if (!document.hidden && ctx.state !== 'running') {
			ctx.resume().catch(() => {});
		}
	});
	listen(ctx.state !== 'running');

	// -------------------------------------------------------------- loading ---
	// The MP3s are kept in the page's Cache Storage once fetched, so they load
	// instantly next time and still play offline; decoded audio is kept only
	// while something is playing it (a decoded track is tens of megabytes).
	const store = ('caches' in window) ? caches.open(CACHE).catch(() => null) : Promise.resolve(null);
	const buffers = new Map(); // name -> what trim() gives
	const loading = new Map(); // name -> Promise of the same
	const urlOf = (name) => new URL(CFG.base + TRACKS[name].file, location.href).href;

	function cached(url) {
		return store.then((c) => (c ? c.match(url) : null)).catch(() => null);
	}
	function fromNet(url) {
		return fetch(url).then((r) => {
			if (!r.ok) {
				throw new Error(url + ': HTTP ' + r.status);
			}
			const copy = r.clone();
			store.then((c) => c && c.put(url, copy)).catch(() => {});
			return r;
		});
	}
	function decode(bytes) {
		return new Promise((resolve, reject) => { // the callback form: older Safari has no promise one
			const p = ctx.decodeAudioData(bytes, resolve, reject);
			if (p && p.catch) {
				p.catch(reject);
			}
		});
	}
	function load(name) {
		if (buffers.has(name)) {
			return Promise.resolve(buffers.get(name));
		}
		if (!loading.has(name)) {
			const url = urlOf(name);
			let wasCached = false;
			const p = cached(url).then((hit) => {
				wasCached = !!hit;
				return hit || fromNet(url);
			})
				.then((r) => r.arrayBuffer())
				.then(decode)
				.then((buf) => {
					const t = trim(buf, TRACKS[name]);
					buffers.set(name, t);
					return t;
				}, (err) => {
					if (wasCached) { // a bad copy: fetch it afresh next time
						store.then((c) => c && c.delete(url)).catch(() => {});
					}
					throw err;
				});
			loading.set(name, p);
			const done = () => loading.delete(name);
			p.then(done, done);
		}
		return loading.get(name);
	}

	// The decoded track, cut to exactly the music, so the loop's end is the
	// buffer's own end (the browser's loop is exact there). A decoder that
	// ignores the MP3's gapless header leaves padding at the start and the end:
	// how much of it is at the start is found from where the music first gets
	// loud, never more than all the extra there is.
	// {buf, lead: seconds cut from the start, decoded: seconds decoded}
	function trim(buf, info) {
		const rate = buf.sampleRate;
		const frames = Math.round(info.length * rate);
		const extra = buf.length - frames;
		const t = { buf: buf, lead: 0, decoded: buf.duration };
		if (extra <= 0) {
			return t;
		}
		let lead = 0;
		if (extra > 0.002 * rate && info.onset != null) {
			let first = Math.min(buf.length, Math.ceil(info.onset * rate) + extra + 1);
			for (let c = 0; c < buf.numberOfChannels; c++) {
				const d = buf.getChannelData(c);
				for (let i = 0; i < first; i++) {
					if (d[i] >= ONSET_LEVEL || d[i] <= -ONSET_LEVEL) {
						first = i;
						break;
					}
				}
			}
			lead = Math.min(Math.max(Math.round(first - info.onset * rate), 0), extra);
		}
		const cut = ctx.createBuffer(buf.numberOfChannels, frames, rate);
		for (let c = 0; c < buf.numberOfChannels; c++) {
			cut.getChannelData(c).set(buf.getChannelData(c).subarray(lead, lead + frames));
		}
		t.buf = cut;
		t.lead = lead / rate;
		return t;
	}

	// Drops decoded audio nothing is playing any more.
	function prune() {
		const used = new Set();
		live.forEach((v) => used.add(v.name));
		slots.forEach((v) => v && v.state !== 'stopped' && used.add(v.name));
		if (sting && sting.state !== 'stopped') {
			used.add(sting.name);
		}
		buffers.forEach((t, name) => used.has(name) || buffers.delete(name));
	}

	// Gets the short pieces (stingers) ready, so the first one isn't late.
	setTimeout(() => {
		Object.keys(TRACKS).forEach((name) => {
			if (TRACKS[name].length < 30) {
				const url = urlOf(name);
				cached(url).then((hit) => hit || fromNet(url).then((r) => r.arrayBuffer())).catch(() => {});
			}
		});
	}, 5000);
	// and forgets MP3s an older build cached that this one doesn't use
	store.then((c) => c && c.keys().then((keys) => {
		const want = new Set(Object.keys(TRACKS).map(urlOf));
		keys.forEach((k) => want.has(k.url) || c.delete(k));
	})).catch(() => {});

	// -------------------------------------------------------------- playing ---
	// A voice is one track playing (or loading, or fading out). Its gain is
	// faded in dB, the way music.gd's tweens do: exponential in Web Audio.
	const slots = [null, null];
	const live = new Set();
	let sting = null;

	function voice(name, from, loopStart, db, loop) {
		return { name: name, from: from, loopStart: loopStart, db: db, loop: loop, state: 'loading', src: null, gain: null };
	}

	// Starts a loaded voice: from `from` seconds in, fading in from -40 dB over `fade`.
	// The start and the loop points are put on whole sample frames: between
	// frames the browser blends neighbouring samples, which dulls the treble.
	function start(v, t, fade) {
		const info = TRACKS[v.name];
		const buf = t.buf;
		const frame = (s) => Math.round(s * buf.sampleRate) / buf.sampleRate;
		const end = Math.min(frame(info.length), buf.length / buf.sampleRate);
		const src = ctx.createBufferSource();
		src.buffer = buf;
		v.trim = { lead: t.lead, decoded: t.decoded };
		v.a = Math.max(frame(v.loopStart), 0);
		if (v.a >= end - 0.5) {
			v.a = 0; // a loop start past the end: loop the whole track
		}
		v.b = end;
		if (v.loop) {
			src.loop = true;
			src.loopStart = v.a;
			src.loopEnd = v.b;
		}
		const g = ctx.createGain();
		src.connect(g);
		g.connect(out);
		const now = ctx.currentTime;
		v.offset = Math.min(Math.max(frame(v.from), 0), frame(end - 0.05));
		if (fade > 0) {
			g.gain.setValueAtTime(lin(-40), now);
			g.gain.exponentialRampToValueAtTime(lin(v.db), now + fade);
		} else {
			g.gain.setValueAtTime(lin(v.db), now);
		}
		if (v.loop) {
			src.start(now, v.offset);
		} else {
			src.start(now, v.offset, end - v.offset);
		}
		v.src = src;
		v.gain = g;
		v.t0 = now;
		v.state = 'playing';
		live.add(v);
		src.onended = () => {
			v.state = 'stopped';
			live.delete(v);
			src.disconnect();
			g.disconnect();
			v.src = null;
			v.gain = null;
			prune();
		};
	}

	// Holds a gain where it is now, cancelling whatever fade it was in.
	function hold(p, now) {
		const val = Math.max(p.value, 1e-5);
		p.cancelScheduledValues(now);
		p.setValueAtTime(val, now);
	}

	function fadeOut(v, fade) {
		if (!v) {
			return;
		}
		if (v.state === 'loading') {
			v.state = 'stopped';
			return;
		}
		if (v.state !== 'playing' && v.state !== 'stopping') {
			return;
		}
		v.state = 'stopping';
		const p = v.gain.gain;
		const now = ctx.currentTime;
		const end = now + Math.max(fade, 0.03);
		hold(p, now);
		p.exponentialRampToValueAtTime(lin(-60), end);
		try {
			v.src.stop(end + 0.02);
		} catch (e) { /* an older Safari refuses a second stop(); the fade still silences it */ }
	}

	// Where a voice is in its track (seconds), counting the loop.
	function where(v) {
		if (!v) {
			return 0;
		}
		if (!v.src) {
			return v.from;
		}
		let p = v.offset + (ctx.currentTime - v.t0);
		if (v.loop && p >= v.b) {
			p = v.a + (p - v.b) % (v.b - v.a);
		}
		return p;
	}

	function ramp(v, db, time) {
		const p = v.gain.gain;
		const now = ctx.currentTime;
		hold(p, now);
		p.exponentialRampToValueAtTime(lin(db), now + Math.max(time, 0.03));
	}

	window.CWMusic = {
		// The tracks there are, as JSON {name: length in seconds}.
		tracks: function () {
			const t = {};
			Object.keys(TRACKS).forEach((n) => { t[n] = TRACKS[n].length; });
			return JSON.stringify(t);
		},

		// Plays `name` in `slot` from `from` seconds, looping back to `loopStart`,
		// fading in to `db` over `fade`; once it sounds, the voice in `oldSlot`
		// (if any) fades out over the same time. Until then the old one plays on,
		// so a track that's still loading never leaves a silence.
		play: function (slot, name, from, loopStart, fade, db, oldSlot) {
			if (!TRACKS[name]) {
				return false;
			}
			const old = oldSlot >= 0 ? slots[oldSlot] : null;
			const prev = slots[slot];
			if (prev && prev.name === name && prev.state === 'playing') {
				// back to a track before the next one even started: it carries on
				ramp(prev, db, fade);
				prev.db = db;
				if (old && old !== prev) {
					fadeOut(old, fade);
				}
				return true;
			}
			fadeOut(prev, prev && prev.state === 'stopping' ? 0.05 : fade);
			const v = voice(name, from, loopStart, db, true);
			slots[slot] = v;
			load(name).then((t) => {
				if (v.state !== 'loading') {
					return; // replaced or stopped while it loaded
				}
				start(v, t, fade);
				if (old && old !== v) {
					fadeOut(old, fade);
				}
			}, (err) => {
				console.warn('Music: ' + name + ' could not be loaded, so it is silent.', err);
				if (v.state === 'loading') {
					v.state = 'stopped';
					fadeOut(old, fade);
				}
			});
			prune();
			return true;
		},

		fadeOut: function (slot, fade) {
			fadeOut(slots[slot], fade);
		},

		// True while the slot's track is loading, playing or fading out.
		playing: function (slot) {
			const v = slots[slot];
			return !!v && v.state !== 'stopped';
		},

		position: function (slot) {
			return where(slots[slot]);
		},

		// A new volume for what's playing (short ramp, so no click).
		level: function (slot, db) {
			const v = slots[slot];
			if (!v) {
				return;
			}
			v.db = db;
			if (v.state === 'playing') {
				ramp(v, db, 0.05);
			}
		},

		// A one-shot piece over the music, in place of any still sounding; once
		// it starts, the music in `duckSlot` (unless -1) dips to `low` dB over
		// `down` seconds, stays there `stay` seconds, and comes back to `back` dB
		// over `up` seconds.
		sting: function (name, db, duckSlot, low, down, stay, back, up) {
			if (!TRACKS[name]) {
				return false;
			}
			fadeOut(sting, 0.05);
			const v = voice(name, 0, 0, db, false);
			sting = v;
			load(name).then((t) => {
				if (v.state !== 'loading') {
					return;
				}
				start(v, t, 0);
				const m = duckSlot >= 0 ? slots[duckSlot] : null;
				if (m && m.state === 'playing') {
					const p = m.gain.gain;
					const now = ctx.currentTime;
					hold(p, now);
					p.exponentialRampToValueAtTime(lin(low), now + down);
					p.setValueAtTime(lin(low), now + down + stay);
					p.exponentialRampToValueAtTime(lin(back), now + down + stay + up);
				}
			}, (err) => {
				console.warn('Music: ' + name + ' could not be loaded.', err);
				v.state = 'stopped';
			});
			return true;
		},

		// For tests (tests/web_music_check.py): the insides, and a jump to
		// `pos` seconds in the slot's track without a fade.
		debug: {
			ctx: ctx,
			out: out,
			slots: slots,
			buffers: buffers,
			sting: () => sting,
			seek: function (slot, pos) {
				const v = slots[slot];
				if (!v || v.state !== 'playing') {
					return false;
				}
				const old = v.src;
				old.onended = null;
				old.stop();
				old.disconnect();
				v.state = 'loading';
				v.from = pos;
				const g = v.gain;
				start(v, { buf: old.buffer, lead: v.trim.lead, decoded: v.trim.decoded }, 0);
				g.disconnect(); // the new start made its own gain, at the voice's level
				return true;
			},
		},
	};
}());

<script>
// The phone link's film player (window.CWFilm): Gary's 4K films through the
// browser's own video player, streamed, driven by scripts/story/web_video_player.gd
// the way the iPhone and Mac apps drive their NativeVideoPlayer.
//
// Godot's web player only plays Theora, at a size the phone can hold, and the
// whole file has to come down first. The browser's own <video> plays H.264 in
// 4K with the phone's hardware, and streams it: each film is published as HLS
// (tools/make_hls.sh: Gary's 4K picture untouched, a 1080p copy and a 540p
// copy, cut into the same 4-second pieces) under films/<name>/master.m3u8 next
// to index.html, so it starts in a second or two and steps up to 4K as fast as
// the connection allows. Safari (every browser on an iPhone) plays HLS itself;
// elsewhere hls.js (hls.light.min.js next to index.html, loaded the first time
// it's needed) feeds the same <video> through Media Source.
//
// tools/build_web.sh puts this script in index.html. The page's video sits
// over the game's canvas, black, the picture shown whole. A tap on it is
// reported as TAPPED; Skip (show_skip) as SKIP_PRESSED; Esc skips, Enter,
// Space and E show Skip and then skip; its end FINISHED; a failure FAILED.
//
// iOS lets a video play with sound only from inside a touch. The first touch,
// click or key anywhere on the page (the notice's Continue, usually) "primes"
// the video element by calling play() on it there, empty, which lifts that
// rule for the element for good; if a browser still refuses later, a Play
// button over the picture asks for the touch.
(function () {
	'use strict';
	const TAPPED = 1, SKIP_PRESSED = 2, FINISHED = 4, FAILED = 8;
	const HLS_JS = 'hls.light.min.js';
	let video = null, root = null, skip = null, sub = null, playBtn = null;
	let hls = null;
	let events = 0;
	let ready = false, failed = false, finished = false, error = '';
	let wantPlaying = false, skipShown = false, open = false;
	// Which films are on the site: films/sizes.txt, a line a film ("<name>
	// <bytes>", kept by tools/publish_web.sh), read once as the page loads.
	// null: not known (still coming, or the list isn't there), when a film is
	// simply tried and a missing one fails within a moment.
	let published = null;
	try {
		fetch('films/sizes.txt', { cache: 'no-cache' }).then((r) => (r.ok ? r.text() : null)).then((t) => {
			if (t !== null) {
				published = new Set(t.split('\n').map((l) => l.trim().split(/\s+/)[0]).filter((n) => n));
			}
		}).catch(() => {});
	} catch (e) { /* no fetch: films are tried as they come */ }

	function make() {
		if (video) {
			return;
		}
		root = document.createElement('div');
		root.id = 'cw-film';
		root.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:2147483000;background:#000;' +
			'display:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;';
		video = document.createElement('video');
		video.setAttribute('playsinline', '');
		video.setAttribute('webkit-playsinline', '');
		video.setAttribute('preload', 'none');
		video.disablePictureInPicture = true;
		video.controls = false;
		video.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain;background:#000;pointer-events:none;';
		root.appendChild(video);
		sub = document.createElement('div');
		sub.style.cssText = 'position:absolute;left:8%;right:8%;bottom:calc(6% + env(safe-area-inset-bottom));text-align:center;' +
			'color:#fff;font:500 clamp(16px,2.6vw,30px)/1.3 Georgia,serif;text-shadow:0 0 6px #000,0 2px 4px #000;pointer-events:none;';
		root.appendChild(sub);
		skip = document.createElement('button');
		skip.type = 'button';
		skip.textContent = 'Skip';
		skip.style.cssText = 'position:absolute;top:calc(24px + env(safe-area-inset-top));right:calc(24px + env(safe-area-inset-right));' +
			'padding:12px 30px;border-radius:28px;border:1px solid rgba(232,196,120,0.75);background:rgba(10,10,18,0.72);' +
			'color:#f3dca2;font:600 20px Georgia,serif;letter-spacing:0.04em;opacity:0;transition:opacity .25s;pointer-events:none;';
		root.appendChild(skip);
		playBtn = document.createElement('button');
		playBtn.type = 'button';
		playBtn.textContent = '▶  Play the film';
		playBtn.style.cssText = 'position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:18px 40px;border-radius:34px;' +
			'border:1px solid rgba(232,196,120,0.8);background:rgba(10,10,18,0.8);color:#f3dca2;font:600 24px Georgia,serif;display:none;';
		root.appendChild(playBtn);
		document.body.appendChild(root);

		const tap = (e) => {
			e.preventDefault();
			e.stopPropagation();
			if (e.target === playBtn) {
				startPlaying();
				return;
			}
			if (e.target === skip && skipShown) {
				events |= SKIP_PRESSED;
				return;
			}
			events |= TAPPED;
		};
		root.addEventListener('pointerup', tap);
		root.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); });
		root.addEventListener('touchstart', (e) => { e.stopPropagation(); }, { passive: true });
		root.addEventListener('contextmenu', (e) => e.preventDefault());
		window.addEventListener('keydown', (e) => {
			if (!open) {
				return;
			}
			if (e.key === 'Escape' || e.key === 'Tab') {
				events |= SKIP_PRESSED;
			} else if (e.key === 'Enter' || e.key === ' ' || e.key === 'e' || e.key === 'E') {
				events |= skipShown ? SKIP_PRESSED : TAPPED;
			} else {
				return;
			}
			e.preventDefault();
			e.stopPropagation();
		}, true);
		video.addEventListener('canplay', () => { ready = true; });
		video.addEventListener('loadeddata', () => { ready = true; });
		video.addEventListener('ended', () => { finished = true; events |= FINISHED; });
		video.addEventListener('error', () => {
			const err = video.error;
			fail('video error' + (err ? ' ' + err.code + (err.message ? ': ' + err.message : '') : ''));
		});
		document.addEventListener('visibilitychange', () => {
			if (!open) {
				return;
			}
			if (document.hidden) {
				video.pause();
			} else if (wantPlaying && !finished) {
				startPlaying();
			}
		});
	}

	function fail(why) {
		if (failed) {
			return;
		}
		failed = true;
		error = why;
		events |= FAILED;
		console.warn('CWFilm: ' + why);
	}

	// The first touch, click or key anywhere: play() on the empty element inside
	// it, so iOS lets it play with sound later without another touch.
	const GESTURES = ['touchend', 'pointerup', 'mousedown', 'keydown', 'click'];
	let primed = false;
	function prime() {
		if (primed) {
			return;
		}
		primed = true;
		GESTURES.forEach((g) => window.removeEventListener(g, prime, true));
		make();
		if (!open) {
			try {
				const p = video.play();
				if (p && p.catch) {
					p.catch(() => {});
				}
			} catch (e) { /* an empty element can't play: priming is all it was for */ }
		}
	}
	GESTURES.forEach((g) => window.addEventListener(g, prime, true));

	function loadScript(src) {
		return new Promise((resolve, reject) => {
			const s = document.createElement('script');
			s.src = src;
			s.onload = resolve;
			s.onerror = () => reject(new Error('could not load ' + src));
			document.head.appendChild(s);
		});
	}

	function nativeHls() {
		const v = video || document.createElement('video');
		return !!v.canPlayType && v.canPlayType('application/vnd.apple.mpegurl') !== '';
	}
	function mse() {
		return !!(window.MediaSource || window.ManagedMediaSource || window.WebKitMediaSource);
	}

	function startPlaying() {
		if (!video || finished || failed) {
			return;
		}
		wantPlaying = true;
		let p;
		try {
			p = video.play();
		} catch (e) {
			p = Promise.reject(e);
		}
		if (p && p.then) {
			p.then(() => { playBtn.style.display = 'none'; }).catch((e) => {
				if (e && e.name === 'NotAllowedError') {
					playBtn.style.display = 'block';   // the browser wants a touch first
				} else if (e && e.name !== 'AbortError') {
					fail('play: ' + e);
				}
			});
		}
	}

	window.CWFilm = {
		// Whether this browser can stream a film at all (Safari's own HLS, or
		// Media Source for hls.js). Without it the game plays the Theora copy.
		supported: function () {
			return nativeHls() || mse();
		},
		open: function (url) {
			make();
			this.stop();
			ready = failed = finished = false;
			events = 0;
			error = '';
			open = true;
			root.style.display = 'block';
			root.style.opacity = '1';
			video.muted = false;
			video.volume = 1;
			if (nativeHls()) {
				video.src = url;
				video.load();
				return true;
			}
			if (!mse()) {
				fail('no HLS and no Media Source here');
				return false;
			}
			const attach = () => {
				if (!open || failed) {
					return;
				}
				const Hls = window.Hls;
				if (!Hls || !Hls.isSupported()) {
					fail('hls.js not supported here');
					return;
				}
				hls = new Hls({ capLevelToPlayerSize: false, startLevel: -1, maxBufferLength: 20, backBufferLength: 10 });
				hls.on(Hls.Events.ERROR, (ev, data) => {
					if (!data.fatal) {
						return;
					}
					if (data.type === Hls.ErrorTypes.MEDIA_ERROR && !hls._recovered) {
						hls._recovered = true;
						hls.recoverMediaError();
						return;
					}
					fail('hls ' + data.type + ': ' + data.details);
				});
				hls.loadSource(url);
				hls.attachMedia(video);
				if (wantPlaying) {
					startPlaying();
				}
			};
			if (window.Hls) {
				attach();
			} else {
				loadScript(HLS_JS).then(attach).catch((e) => fail(String(e)));
			}
			return true;
		},
		// Whether the site has the film called `name`: 1 yes, 0 no, -1 not known.
		has: function (name) {
			return published === null ? -1 : (published.has(name) ? 1 : 0);
		},
		play: function () { startPlaying(); },
		pause: function () { wantPlaying = false; if (video) { video.pause(); } },
		stop: function () {
			open = false;
			wantPlaying = false;
			skipShown = false;
			if (hls) {
				try { hls.destroy(); } catch (e) { /* gone already */ }
				hls = null;
			}
			if (video) {
				video.pause();
				video.removeAttribute('src');
				try { video.load(); } catch (e) { /* nothing to unload */ }
			}
			if (root) {
				root.style.display = 'none';
				skip.style.opacity = '0';
				skip.style.pointerEvents = 'none';
				playBtn.style.display = 'none';
				sub.textContent = '';
			}
		},
		// Everything the game asks once a frame, as one JSON string.
		state: function () {
			const v = video;
			const out = {
				ev: events,
				ready: ready,
				failed: failed,
				finished: finished,
				playing: !!v && !v.paused && !v.ended,
				pos: v ? (v.currentTime || 0) : 0,
				len: v && isFinite(v.duration) ? v.duration : 0,
				w: v ? v.videoWidth : 0,
				h: v ? v.videoHeight : 0,
				level: hls ? hls.currentLevel : -1,
				error: error,
			};
			events = 0;
			return JSON.stringify(out);
		},
		set_volume: function (k) { if (video) { video.volume = Math.max(0, Math.min(1, k)); } },
		set_opacity: function (k) { if (root) { root.style.opacity = String(Math.max(0, Math.min(1, k))); } },
		// Hidden (a story film paused for a choice): out of the way altogether,
		// so taps reach the game's own buttons under it.
		set_visible: function (on) { if (root) { root.style.display = on && open ? 'block' : 'none'; } },
		set_subtitle: function (text) { if (sub) { sub.textContent = text || ''; } },
		show_skip: function (on, text) {
			make();
			skipShown = !!on;
			skip.textContent = text || 'Skip';
			skip.style.opacity = on ? '1' : '0';
			skip.style.pointerEvents = on ? 'auto' : 'none';
		},
		seek: function (t) { if (video) { video.currentTime = t; } },
	};
})();
</script>
</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--false use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args": [], "canvasResizePolicy": 2, "emscriptenPoolSize": 8, "ensureCrossOriginIsolationHeaders": false, "executable": "index", "experimentalVK": true, "fileSizes": {"index.wasm": 39514754}, "focusCanvas": true, "gdextensionLibs": [], "godotPoolSize": 4, "serviceWorker": "index.service.worker.js", "packParts": [["index.pck.part0", 90000000], ["index.pck.part1", 14983340]]};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		const onProgress = function (current, total) {
			if (current > 0 && total > 0) {
				statusProgress.value = current;
				statusProgress.max = total;
			} else {
				statusProgress.removeAttribute('value');
				statusProgress.removeAttribute('max');
			}
		};
		// The pack is split into parts (GitHub Pages won't serve a file over 100 MB):
		// download them in turn, stitch them together, and hand the engine one pack.
		const PARTS = GODOT_CONFIG['packParts'];
		const total = PARTS.reduce((a, p) => a + p[1], 0);
		let loaded = 0;
		const chunks = [];
		const fetchPart = function (i) {
			if (i >= PARTS.length) {
				return Promise.resolve();
			}
			return fetch(PARTS[i][0]).then(function (r) {
				if (!r.ok) {
					throw new Error('Failed loading file ' + PARTS[i][0]);
				}
				const reader = r.body.getReader();
				const pump = function () {
					return reader.read().then(function (res) {
						if (res.done) {
							return Promise.resolve();
						}
						chunks.push(res.value);
						loaded += res.value.length;
						onProgress(loaded, total);
						return pump();
					});
				};
				return pump();
			}).then(function () {
				return fetchPart(i + 1);
			});
		};
		Promise.all([engine.init(GODOT_CONFIG['executable']), fetchPart(0)]).then(function () {
			const pack = new Uint8Array(chunks.reduce((a, c) => a + c.length, 0));
			let at = 0;
			chunks.forEach(function (c) {
				pack.set(c, at);
				at += c.length;
			});
			chunks.length = 0;
			return engine.preloadFile(pack, 'index.pck');
		}).then(function () {
			return engine.start({ 'args': ['--main-pack', 'index.pck'].concat(GODOT_CONFIG['args']) });
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
